name: Daily Limits & Quotas Monitor

on:
  schedule:
    # Runs everyday at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  monitor-limits:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Limits Monitor Workflow
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python app/limits_monitor_workflow.py

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage tracking files and alert logs
          git add data/ copy_data/ app/ || true
          
          if git diff --staged --quiet; then
            echo "No changes detected in limits or verified timestamps."
          else
            git commit -m "chore(monitor): auto-update monitored limits & verified hashes [skip ci]"
            git push
          fi

